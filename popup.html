<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>流量统计</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { width: 360px; height: 500px; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col justify-between p-4">
  <div>
    <!-- 头部 -->
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-lg font-bold text-slate-900 flex items-center gap-1">
        📊 流量统计
      </h1>
      <span id="session-badge" class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-medium">
        本次会话: 0 MB
      </span>
    </div>

    <!-- 顶部总统计卡片 -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl p-4 shadow-sm mb-4">
      <div class="text-xs text-blue-100">今日累计消耗</div>
      <div class="text-2xl font-extrabold mt-1" id="today-traffic">0 MB</div>
      <div class="flex justify-between text-xs text-blue-200 mt-3 pt-2 border-t border-blue-500/40">
        <span>本月: <strong id="month-traffic" class="text-white">0 MB</strong></span>
        <span>今年: <strong id="year-traffic" class="text-white">0 MB</strong></span>
      </div>
    </div>

    <!-- 选项卡切换 -->
    <div class="flex bg-slate-200 p-1 rounded-lg text-xs font-medium mb-3">
      <button id="tab-day" class="flex-1 py-1.5 rounded-md bg-white shadow text-slate-800">日视图</button>
      <button id="tab-month" class="flex-1 py-1.5 rounded-md text-slate-600 hover:text-slate-900">月视图</button>
      <button id="tab-year" class="flex-1 py-1.5 rounded-md text-slate-600 hover:text-slate-900">年视图</button>
    </div>

    <!-- 柱状图 -->
    <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-100 h-44">
      <canvas id="trafficChart"></canvas>
    </div>
  </div>

  <!-- 底部清理区域 -->
  <div class="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center">
    <select id="clear-type" class="text-xs border border-slate-300 rounded px-2 py-1 bg-white">
      <option value="session">仅清空本次会话</option>
      <option value="today">仅清空今日</option>
      <option value="all">清空所有历史数据</option>
    </select>
    <button id="btn-clear" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition">
      清理数据
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
